name: Daily Commit

on:
  schedule:
    # Runs every day at 12:00 AM IST (6:30 PM UTC)
    - cron: "30 18 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-commit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Update activity file
        run: |
          echo "Updated at $(date)" >> activity.txt

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add activity.txt

          git diff --cached --quiet || git commit -m "chore: daily activity"

      - name: Push
        run: |
          git push
