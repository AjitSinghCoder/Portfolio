name: Daily Commit

on:
  schedule:
    # Runs every day at 12:00 AM IST (6:30 PM UTC)
    - cron: "30 18 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-commit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.DAILY_COMMIT_TOKEN || github.token }}
          persist-credentials: true

      - name: Pull latest & Commit activity
        run: |
          git config user.name "AjitSinghCoder"
          git config user.email "ajitkrsingh841@gmail.com"

          # Pull latest remote changes first
          git pull origin main

          # Append current timestamp
          echo "Updated at $(date)" >> activity.txt

          # Commit
          git add activity.txt
          if ! git diff --cached --quiet; then
            git commit -m "chore: daily activity"

            # Push using PAT if secret exists to guarantee contribution graph credit
            if [ -n "${{ secrets.DAILY_COMMIT_TOKEN }}" ]; then
              git push https://x-access-token:${{ secrets.DAILY_COMMIT_TOKEN }}@github.com/${{ github.repository }}.git main
            else
              git push origin main
            fi
          fi
